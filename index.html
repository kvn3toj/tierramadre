<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-inicio-gris-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-inicio-gris-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-inicio-gris-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- WCAG 2.1 AA: Enable zoom for accessibility (up to 5x) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>Tierra Madre Studio</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#00AE7A" />
    <meta name="description" content="Tierra Madre Studio - Internal Advertising Agency for Emerald Collection" />

    <!-- iOS PWA Meta Tags -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-inicio-gris-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-inicio-gris-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-inicio-gris-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TM Studio" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS Splash Screens -->
    <link rel="apple-touch-startup-image" href="/apple-touch-icon.png" />

    <!-- Prevent iOS from showing Safari UI -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Force all links to stay in PWA -->
    <meta name="apple-mobile-web-app-navigation" content="same-origin" />

    <!-- CRITICAL: Blocking version check - MUST run before React loads -->
    <script>
      (function() {
        var APP_VERSION = '2026.01.09.1250';
        var VERSION_KEY = 'tm_app_version';
        var RELOAD_KEY = 'tm_reload_pending';

        // Expose for main.tsx to check
        window.__TM_VERSION__ = APP_VERSION;
        window.__TM_VERSION_READY__ = false;

        var storedVersion = localStorage.getItem(VERSION_KEY);
        var now = Date.now();

        // Check for reload loop
        var reloadPending = sessionStorage.getItem(RELOAD_KEY);
        if (reloadPending) {
          sessionStorage.removeItem(RELOAD_KEY);
          localStorage.setItem(VERSION_KEY, APP_VERSION);
          window.__TM_VERSION_READY__ = true;
          return;
        }

        // If versions match, we're good
        if (storedVersion === APP_VERSION) {
          window.__TM_VERSION_READY__ = true;
          return;
        }

        // Version mismatch - reload BEFORE React starts
        if (storedVersion && storedVersion !== APP_VERSION) {
          sessionStorage.setItem(RELOAD_KEY, '1');
          localStorage.setItem(VERSION_KEY, APP_VERSION);
          window.location.replace(window.location.pathname + '?_v=' + APP_VERSION + '&_t=' + now);
          // Halt script execution
          throw new Error('Reloading for new version');
        }

        // First visit - store version
        localStorage.setItem(VERSION_KEY, APP_VERSION);
        window.__TM_VERSION_READY__ = true;
      })();
    </script>

    <!-- Google Fonts - Luxury Typography System -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>

    <!-- Service worker cleanup (non-blocking) -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(r) {
          r.forEach(function(reg) { reg.unregister(); });
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(n) {
          n.forEach(function(k) { caches.delete(k); });
        });
      }
    </script>

    <!-- Screenshot Deterrent: NoPrint.js with error handling -->
    <script src="https://pdfanticopy.com/noprint.js" id="noprint-script"></script>
    <script>
      try {
        // The library may expose noPrint OR noCopy - check both
        var protectionFn = typeof noPrint === 'function' ? noPrint :
                           typeof noCopy === 'function' ? noCopy : null;
        if (protectionFn) {
          protectionFn({
            disablePrint: true,
            disableCopy: true,
            disableRightClick: true,
            autoblur: false
          });
        }
      } catch (e) {
        console.warn('[NoPrint] Protection script unavailable:', e.message);
      }
    </script>

    <!-- Safari async version check (backup for server-side updates between page loads) -->
    <script>
      (function() {
        var APP_VERSION = window.__TM_VERSION__;
        var isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent) ||
                       /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                       navigator.standalone === true;

        if (isSafari && window.__TM_VERSION_READY__) {
          fetch('/version.json?_t=' + Date.now(), { cache: 'no-store' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
              if (data.version && data.version !== APP_VERSION) {
                sessionStorage.setItem('tm_reload_pending', '1');
                localStorage.setItem('tm_app_version', data.version);
                window.location.replace(window.location.pathname + '?_v=' + data.version);
              }
            })
            .catch(function() { /* Offline - ignore */ });
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
