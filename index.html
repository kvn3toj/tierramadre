    <!-- CRITICAL: Blocking version check - MUST run before React loads -->
    <script>
      (function () {
        var APP_VERSION = "2026.08.23.278";
        var VERSION_KEY = 'tm_app_version';
        var RELOAD_KEY = 'tm_reload_pending';

        // Expose for main.tsx to check
        window.__TM_VERSION__ = APP_VERSION;
        window.__TM_VERSION_READY__ = false;

        var storedVersion = localStorage.getItem(VERSION_KEY);
        var now = Date.now();

        // Check for reload loop
        var reloadPending = sessionStorage.getItem(RELOAD_KEY);
        if (reloadPending) {
          sessionStorage.removeItem(RELOAD_KEY);
          localStorage.setItem(VERSION_KEY, APP_VERSION);
          window.__TM_VERSION_READY__ = true;
          return;
        }

        // If versions match, we're good
        if (storedVersion === APP_VERSION) {
          window.__TM_VERSION_READY__ = true;
          return;
        }

        // Version mismatch - reload BEFORE React starts
        if (storedVersion && storedVersion !== APP_VERSION) {
          sessionStorage.setItem(RELOAD_KEY, '1');
          localStorage.setItem(VERSION_KEY, APP_VERSION);
          window.location.replace(
            window.location.pathname + '?_v=' + APP_VERSION + '&_t=' + now,
          );
          // Halt script execution
          throw new Error('Reloading for new version');
        }

        // First visit - store version
        localStorage.setItem(VERSION_KEY, APP_VERSION);
        window.__TM_VERSION_READY__ = true;
      })();
    </script>

    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />

    <!-- No hero image is preloaded here on purpose. This used to high-priority
         preload the first gem image of <CategoryCarousels>, but that component
         is exported through the home barrel and never actually rendered by any
         route — so every page load in the whole app fetched a full-size
         Cloudinary JPEG at fetchpriority="high" that nothing ever displayed
         ("preloaded using link preload but not used" in the console).
         If a hero preload comes back, it must point at an image the landing
         route really paints, and only on that route. -->
  </head>
  <body>
    <div id="root"></div>

    <!-- Screenshot deterrence lives in the app, NOT in a third-party script.
         `ScreenProtectionProvider` (contexts/ScreenProtectionContext.tsx) +
         `useScreenshotDetection` cover PrintScreen, Cmd/Win+Shift+3/4/5,
         visibility change and window blur; per-image right-click/selection
         blocking is scoped to the components that show media (ImageWatermark,
         EmeraldCard, MediaGallery, ImageLightbox) and utils/pwa.ts.

         We used to also load https://pdfanticopy.com/noprint.js here. It is not
         a library — it is a top-level script that reads bare globals (noCopy,
         noPrint, autoBlur, noScreenshot) at load time and ignores any argument,
         so the config object passed to it never did anything. Because the shim
         above it defined noCopy/noPrint as truthy functions, the script ran its
         full body and then, on every mouseleave/blur, hit
         `if (autoBlur)` with autoBlur never defined anywhere ->
         "Uncaught ReferenceError: autoBlur is not defined" on repeat.
         It also assigned `document.body.style.cssText` wholesale on load AND on
         every click, wiping MUI's scroll-lock styles and any inline body style
         React had set; forced `user-select: none` on every div in the app;
         overwrote document-level DOM0 handlers; blocked the context menu even
         inside inputs (defeating the editable-field exemption pwa.ts adds on
         purpose); and inserted a black <span> as body's first child. Net effect
         in production: a frozen, unusable UI. Do not reintroduce it. -->

    <!-- Safari async version check (backup for server-side updates between page loads) -->
    <script>
      (function () {
        var APP_VERSION = window.__TM_VERSION__;
        var isSafari =
          /^((?!chrome|android).)*safari/i.test(navigator.userAgent) ||
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          navigator.standalone === true;

        if (isSafari && window.__TM_VERSION_READY__) {
          fetch('/version.json?_t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) {
              return r.json();
            })
            .then(function (data) {
              if (data.version && data.version !== APP_VERSION) {
                sessionStorage.setItem('tm_reload_pending', '1');
                localStorage.setItem('tm_app_version', data.version);
                window.location.replace(
                  window.location.pathname + '?_v=' + data.version,
                );
              }
            })
            .catch(function () {
              /* Offline - ignore */
            });
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
