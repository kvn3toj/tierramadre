<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- White background -->
  <rect width="100" height="100" fill="#ffffff"/>

  <!-- Emerald green Tierra Madre symbol - simplified version -->
  <g transform="translate(50, 50)">
    <!-- Top leaf -->
    <path d="M 0,-30 L 15,-10 L 8,-5 L 0,-15 L -8,-5 L -15,-10 Z" fill="#00AE7A" stroke="#00AE7A" stroke-width="1"/>

    <!-- Right leaf -->
    <path d="M 30,0 L 10,15 L 5,8 L 15,0 L 5,-8 L 10,-15 Z" fill="#00AE7A" stroke="#00AE7A" stroke-width="1"/>

    <!-- Bottom leaf -->
    <path d="M 0,30 L -15,10 L -8,5 L 0,15 L 8,5 L 15,10 Z" fill="#00AE7A" stroke="#00AE7A" stroke-width="1"/>

    <!-- Left leaf -->
    <path d="M -30,0 L -10,-15 L -5,-8 L -15,0 L -5,8 L -10,15 Z" fill="#00AE7A" stroke="#00AE7A" stroke-width="1"/>

    <!-- Center emerald dots -->
    <circle cx="0" cy="-8" r="2" fill="#00AE7A"/>
    <circle cx="0" cy="8" r="2" fill="#00AE7A"/>
    <circle cx="4" cy="0" r="2" fill="#00AE7A"/>
    <circle cx="-4" cy="0" r="2" fill="#00AE7A"/>
    <circle cx="7" cy="-4" r="1.5" fill="#00AE7A"/>
    <circle cx="7" cy="4" r="1.5" fill="#00AE7A"/>
    <circle cx="-7" cy="-4" r="1.5" fill="#00AE7A"/>
    <circle cx="-7" cy="4" r="1.5" fill="#00AE7A"/>

    <!-- Center frame -->
    <rect x="-6" y="-3" width="12" height="6" fill="none" stroke="#00AE7A" stroke-width="2" rx="1"/>
  </g>
</svg>
