<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Cert render harness</title>
    <!--
      The SAME font families/weights the app loads (index.html) — the certificate
      is typeset in Cormorant Garamond, and exportCert's `waitForFonts` blocks the
      raster until these faces are ready. Without them the text would be laid out
      with fallback metrics and the name/details lines would land off-baseline.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="cert-root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
