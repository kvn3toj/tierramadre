<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex:none; width:284px;">
  <div style="{{ frameStyle }}">
    <div style="position:absolute; top:0; left:0; right:0; height:46px; display:flex; align-items:center; justify-content:space-between; padding:0 26px 0 30px; z-index:5; color:var(--text); font-family:var(--ui); pointer-events:none;">
      <div style="font-size:14px; font-weight:600; letter-spacing:.2px;">9:41</div>
      <div style="position:absolute; left:50%; top:9px; transform:translateX(-50%); width:88px; height:26px; background:#000; border-radius:16px;"></div>
      <div style="display:flex; align-items:center; gap:6px;">
        <div style="display:flex; align-items:flex-end; gap:1.5px; height:11px;">
          <div style="width:3px; height:4px; background:var(--text); border-radius:1px;"></div>
          <div style="width:3px; height:6px; background:var(--text); border-radius:1px;"></div>
          <div style="width:3px; height:8px; background:var(--text); border-radius:1px;"></div>
          <div style="width:3px; height:11px; background:var(--text); border-radius:1px;"></div>
        </div>
        <div style="width:15px; height:11px; opacity:.92;">{{ wifiGlyph }}</div>
        <div style="display:flex; align-items:center; gap:1.5px;">
          <div style="width:22px; height:11px; border:1px solid var(--text); border-radius:3px; opacity:.55; padding:1.5px; box-sizing:border-box;"><div style="width:75%; height:100%; background:var(--text); border-radius:1px;"></div></div>
          <div style="width:1.5px; height:4px; background:var(--text); border-radius:1px; opacity:.55;"></div>
        </div>
      </div>
    </div>
    <div style="position:absolute; top:46px; left:0; right:0; bottom:0; overflow:hidden; display:flex; flex-direction:column;">
      {{ children }}
    </div>
  </div>
  <div style="text-align:center; margin-top:14px; font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:{{ labelColor }};">{{ label }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:680},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cur-light&quot;,&quot;cur-dark&quot;,&quot;new-light&quot;,&quot;new-dark&quot;],&quot;default&quot;:&quot;new-light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;labelColor&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;#8A928F&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  themes() {
    return {
      "cur-light": {

        accent:"#33FFBF", accentStrong:"#00C99A", onAccent:"#00140E", accentPure:"#33FFBF",
        glass:"rgba(28,30,34,0.66)", glassBorder:"rgba(255,255,255,0.12)", glassBlur:"blur(9px)",

      frameStyle, wifiGlyph, children: this.props.children,
      label: this.props.label || "",
      labelColor: this.props.labelColor || "#8A928F",
    };
  }
}
</script>
</body>
</html>
