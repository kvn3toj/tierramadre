<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600&family=Hanken+Grotesk:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
</helmet>
<div style="display:flex; flex-direction:column; height:100%; background:var(--bg); color:var(--text); font-family:var(--ui,'Hanken Grotesk',sans-serif);">
  <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 16px 12px;">
    <div style="display:flex; align-items:center; gap:12px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"></path></svg>
      <div style="font-family:var(--serif,'Cormorant',serif); font-size:24px; font-weight:500;">Cotización</div>
    </div>
    <div style="font-family:var(--mono,monospace); font-size:10px; letter-spacing:.06em; color:var(--subtle);">TM-2451</div>
  </div>

  <div style="flex:1; overflow:hidden;">
    <div style="margin:0 16px;">
      <sc-for list="{{ meta }}" as="m" hint-placeholder-count="3">
        <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-top:1px solid var(--hairline);">
          <div style="font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--subtle);">{{ m.k }}</div>
          <div style="font-size:12.5px; font-weight:500;">{{ m.v }}</div>
        </div>
      </sc-for>
    </div>

    <div style="font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--subtle); padding:18px 16px 4px;">Piezas</div>
    <div style="margin:0 16px;">
      <sc-for list="{{ items }}" as="p" hint-placeholder-count="2">
        <div style="display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--hairline);">
          <div style="position:relative; width:42px; height:42px; flex:none; border-radius:4px; overflow:hidden; background:var(--surface-2);">
            <img src="{{ p.img }}" alt="" style="{{ p.style }}">
          </div>
          <div style="flex:1; min-width:0;">
            <div style="font-family:var(--serif,'Cormorant',serif); font-size:16px; font-weight:500; line-height:1;">{{ p.name }}</div>
            <div style="font-family:var(--mono,monospace); font-size:9px; color:var(--subtle); margin-top:3px;">{{ p.spec }}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:12.5px; font-weight:600;">{{ p.price }}</div>
            <div style="font-size:9px; color:var(--subtle); margin-top:2px;">{{ p.qty }}</div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="margin:14px 16px 0; padding-top:13px; border-top:1px solid var(--border);">
      <sc-for list="{{ totals }}" as="t" hint-placeholder-count="2">
        <div style="display:flex; align-items:center; justify-content:space-between; padding:4px 0;">
          <div style="font-size:12px; color:var(--muted);">{{ t.k }}</div>
          <div style="font-size:12px; color:{{ t.color }}; font-weight:{{ t.weight }};">{{ t.v }}</div>
        </div>
      </sc-for>
      <div style="display:flex; align-items:flex-end; justify-content:space-between; margin-top:9px; padding-top:11px; border-top:1px solid var(--hairline);">
        <div style="font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--subtle);">Total</div>
        <div style="display:flex; align-items:baseline; gap:6px;">
          <span style="width:7px; height:7px; border-radius:50%; background:var(--accent-pure); align-self:center;"></span>
          <span style="font-size:23px; font-weight:600; letter-spacing:-.4px;">$19,100</span>
        </div>
      </div>
      <div style="font-family:var(--mono,monospace); font-size:9px; color:var(--subtle); text-align:right; margin-top:4px;">VÁLIDA 15 DÍAS · COP 77.300.000</div>
    </div>
  </div>

  <div style="display:flex; gap:10px; padding:11px 16px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--hairline); background:var(--bg);">
    <div style="flex:1; display:flex; align-items:center; justify-content:center; height:46px; border-radius:8px; background:var(--accent-strong); color:var(--on-accent); font-size:13px; font-weight:600;">Generar PDF</div>
    <div style="flex:none; padding:0 18px; display:flex; align-items:center; justify-content:center; height:46px; border-radius:8px; border:1px solid var(--border); color:var(--text); font-size:13px; font-weight:500;">WhatsApp</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:284,&quot;height&quot;:554}}">
class Component extends DCLogic {
  renderVals() {
    const mk = (img,zoom,ox,oy)=>({position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover",transform:"scale("+zoom+")",transformOrigin:ox+" "+oy});
    return {
      meta: [
        {k:"Cliente", v:"Sofía Restrepo"},
        {k:"Asesor", v:"Camila Vélez"},
        {k:"Fecha", v:"30 jun 2026"},
      ],
      items: [
        {name:"Tayrona", spec:"4.20 ct · MUZO", price:"$14,500", qty:"× 1", img:"assets/emeralds/tayrona.png", style:mk("assets/emeralds/tayrona.png",2.2,"50%","40%")},
        {name:"Cronos", spec:"2.14 ct · CHIVOR", price:"$5,600", qty:"× 1", img:"assets/emeralds/cronos.png", style:mk("assets/emeralds/cronos.png",3.0,"50%","57%")},
      ],
      totals: [
        {k:"Subtotal", v:"$20,100", color:"var(--text)", weight:500},
        {k:"Descuento", v:"− $1,000", color:"var(--accent)", weight:500},
      ],
    };
  }
}
</script>
</body>
</html>
