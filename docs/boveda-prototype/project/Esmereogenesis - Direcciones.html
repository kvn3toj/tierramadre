<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Esmereogénesis · Direcciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
    background: #f0eee9;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { width: 100%; height: 100vh; }

  .serif { font-family: 'Playfair Display', Georgia, serif; font-weight: 500; }

  @keyframes dirSheen { to { transform: rotate(360deg); } }
  @keyframes bovRise {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.6); }
    16%  { opacity: 0.95; }
    100% { opacity: 0; transform: translate(var(--drift, 0), -300px) scale(1); }
  }
  @keyframes bovMist {
    0%   { opacity: 0.65; transform: translateY(0) scale(1); }
    100% { opacity: 1; transform: translateY(-6px) scale(1.08); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="frames/design-canvas.jsx"></script>
  <script type="text/babel" src="components/dir-data.jsx"></script>
  <script type="text/babel" src="components/dir-luminaria.jsx"></script>
  <script type="text/babel" src="components/dir-minima.jsx"></script>
  <script type="text/babel" src="components/dir-boveda.jsx"></script>
  <script type="text/babel" src="components/dir-canvas.jsx"></script>
</body>
</html>
